databaseChangeLog:
  - changeSet:
      id: create-google-credential-table
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: google_credential
      changes:
        - createTable:
            tableName: google_credential
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_google_credential_user
                    referencedTableName: users
                    referencedColumnNames: user_id
                    deleteCascade: true
              - column:
                  name: encrypted_refresh_token
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: connected_at
                  type: TIMESTAMP
