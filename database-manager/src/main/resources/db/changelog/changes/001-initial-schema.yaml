        - addForeignKeyConstraint:
            baseTableName: application
            baseColumnNames: employee_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_application_employee
        - addForeignKeyConstraint:
            baseTableName: application
            baseColumnNames: reviewer_id
            referencedTableName: users
