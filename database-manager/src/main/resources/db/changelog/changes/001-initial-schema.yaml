databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 002-create-users
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: TEXT
              - column:
                  name: refresh_expiration
                  type: TIMESTAMP
              - column:
                  name: force_password_change
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: reset_token
                  type: VARCHAR(255)
              - column:
                  name: reset_token_expiration
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: employment_start_date
                  type: DATE
              - column:
                  name: employment_end_date
                  type: DATE
              - column:
                  name: manager_id
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: manager_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_users_manager
        - createIndex:
            indexName: idx_user_manager
            tableName: users
            columns:
              - column:
                  name: manager_id

  - changeSet:
      id: 003-create-user-roles
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_roles_user
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

  - changeSet:
