              - column:
                  name: daily_hours
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: max_daily_hours
                  type: INT
              - column:
                  name: max_weekly_hours
                  type: INT
              - column:
                  name: rounding_minutes
                  type: INT

  - changeSet:
