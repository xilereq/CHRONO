databaseChangeLog:
  - changeSet:
      id: 006-create-generated-reports
      author: xileq
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: generated_reports
      changes:
        - createTable:
            tableName: generated_reports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: report_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: format
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: subject_user_id
                  type: INT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_genreport_subject_user
                    references: users(user_id)
              - column:
                  name: requested_by_user_id
                  type: INT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_genreport_requested_by_user
                    references: users(user_id)
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 006-index-generated-reports-subject-created
      author: BBanszczyk
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: generated_reports
                indexName: idx_genreport_subject_created
      changes:
        - createIndex:
            tableName: generated_reports
            indexName: idx_genreport_subject_created
            columns:
              - column:
                  name: subject_user_id
              - column:
                  name: created_at
