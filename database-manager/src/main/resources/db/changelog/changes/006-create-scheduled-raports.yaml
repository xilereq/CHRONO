databaseChangeLog:
  - changeSet:
      id: create-scheduled-reports-table
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: scheduled_reports
      changes:
        - createTable:
            tableName: scheduled_reports
            columns:
              - column:
                  name: schedule_id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scheduled_report_creator
                    referencedTableName: users
                    referencedColumnNames: user_id
                    deleteCascade: true
              - column:
                  name: report_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: report_format
                  type: VARCHAR(15)
                  constraints:
                    nullable: false
              - column:
                  name: frequency
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: day_of_week
                  type: INT
              - column:
                  name: day_of_month
                  type: INT
              - column:
                  name: execution_time
                  type: TIME
                  defaultValue: 07:00:00
                  constraints:
                    nullable: false
              - column:
                  name: report_period
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: custom_start_date
                  type: DATE
              - column:
                  name: custom_end_date
                  type: DATE
              - column:
                  name: recipient_emails
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: next_run_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_run_at
                  type: TIMESTAMP
              - column:
                  name: last_run_status
                  type: VARCHAR(20)
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-index-scheduled-reports-next-run
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_scheduled_reports_next_run
                tableName: scheduled_reports
      changes:
        - createIndex:
            indexName: idx_scheduled_reports_next_run
            tableName: scheduled_reports
            columns:
              - column:
                  name: is_active
              - column:
                  name: next_run_at

  - changeSet:
      id: create-scheduled-report-target-users-table
      author: JDlubak
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: scheduled_report_target_users
      changes:
        - createTable:
            tableName: scheduled_report_target_users
            columns:
              - column:
                  name: schedule_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_srtu_schedule
                    referencedTableName: scheduled_reports
                    referencedColumnNames: schedule_id
                    deleteCascade: true
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_srtu_user
                    referencedTableName: users
                    referencedColumnNames: user_id
                    deleteCascade: true
        - addPrimaryKey:
            tableName: scheduled_report_target_users
            columnNames: schedule_id, user_id
            constraintName: pk_scheduled_report_target_users
